<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking TRex 🦖 v5 - Blogspot Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            background: linear-gradient(135deg, #0a1a2a 0%, #1a3a2a 100%);
            font-family: 'Arial', sans-serif;
            color: white;
            min-height: 100vh;
            padding: 10px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 2px solid #ff4400;
        }
        
        /* 3D Dinozor (CSS + SVG Animasyon) */
        .dino-display {
            text-align: center;
            font-size: 120px;
            margin: 20px 0;
            animation: dinoBounce 2s infinite;
            filter: drop-shadow(0 0 10px #ff4400);
        }
        
        @keyframes dinoBounce {
            0%, 100% { transform: translateY(0px) scaleX(1); }
            25% { transform: translateY(-10px) scaleX(1); }
            50% { transform: translateY(0px) scaleX(1); }
            75% { transform: translateY(-5px) scaleX(1); }
        }
        
        .dino-display.talking {
            animation: dinoTalk 0.1s infinite;
        }
        
        @keyframes dinoTalk {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.95); }
        }
        
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #ff0;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 15px #ff0; }
            50% { text-shadow: 0 0 25px #ff6600; }
        }
        
        #mood-indicator {
            text-align: center;
            font-size: 40px;
            margin: 10px 0;
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }
        
        button {
            background: linear-gradient(135deg, #ff4400, #ff6600);
            color: white;
            border: none;
            padding: 12px 10px;
            border-radius: 50px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 60, 0, 0.5);
            transition: all 0.2s;
            font-weight: bold;
            width: 100%;
        }
        
        button:hover {
            background: linear-gradient(135deg, #ff6600, #ff8800);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 60, 0, 0.7);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        #status {
            text-align: center;
            margin: 12px 0;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            font-weight: bold;
            font-size: 12px;
            border-left: 4px solid #ff4400;
            min-height: 20px;
        }
        
        #chat {
            margin-top: 12px;
            height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.4;
            border: 1px solid #ff4400;
        }
        
        .message {
            margin: 6px 0;
            padding: 8px 10px;
            border-radius: 12px;
            max-width: 95%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .user { 
            background: #3388ff; 
            margin-left: auto;
            text-align: right;
        }
        
        .trex { 
            background: #22aa55; 
        }
        
        /* Audio Bars */
        .audio-bar {
            display: none;
            justify-content: center;
            gap: 4px;
            margin: 10px 0;
        }
        
        .audio-bar.active {
            display: flex;
        }
        
        .bar {
            width: 4px;
            height: 25px;
            background: linear-gradient(to top, #ff4400, #ffaa00);
            border-radius: 2px;
            animation: pulse 0.3s infinite;
        }
        
        .bar:nth-child(1) { animation-delay: 0s; }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.1s; }
        .bar:nth-child(5) { animation-delay: 0s; }
        
        @keyframes pulse {
            0%, 100% { height: 8px; }
            50% { height: 25px; }
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            overflow-y: auto;
        }
        
        .modal-content {
            background: rgba(10, 26, 42, 0.95);
            margin: 5% auto;
            padding: 20px;
            border: 2px solid #ff4400;
            width: 90%;
            max-width: 500px;
            border-radius: 15px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .close-modal {
            color: #ff4400;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close-modal:hover {
            color: #ff6600;
        }
        
        .history-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border-left: 4px solid #ff4400;
            font-size: 12px;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #ff4400;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦖 Talking TRex v5</h1>
        
        <div class="dino-display" id="dinoDisplay">🦖</div>
        
        <div id="mood-indicator">😊</div>
        
        <div id="status">Hazır • Başlamak için tıkla</div>
        
        <div class="audio-bar" id="audioBar">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        
        <div class="button-grid">
            <button onclick="startListening()">🎤 Konuş</button>
            <button onclick="tellJoke()">😂 Fıkra</button>
            <button onclick="randomResponse()">🎲 Rastgele</button>
            <button onclick="dance()" class="full-width">💃 Dans</button>
        </div>
        
        <div class="button-grid">
            <button onclick="tellStory()">📖 Hikaye</button>
            <button onclick="roar()">🔊 Kükre</button>
            <button onclick="changeMood()" class="full-width">😊 Ruh Halini Değiştir</button>
        </div>
        
        <div class="button-grid">
            <button onclick="showDinoSelector()" class="full-width">🦕 Dinozor Seç</button>
            <button onclick="showHistory()" class="full-width">📋 Geçmiş</button>
        </div>
        
        <div id="chat"></div>
    </div>
    
    <!-- Geçmiş Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeHistory()">&times;</span>
            <h2 style="text-align: center; color: #ff4400;">📋 Sohbet Geçmişi</h2>
            <div id="historyContent"></div>
            <button onclick="clearHistory()" style="width: 100%; margin-top: 15px;">🗑️ Geçmişi Temizle</button>
        </div>
    </div>

    <script>
        // === GLOBAL DEĞİŞKENLER ===
        let isTalking = false;
        let currentMood = "happy";
        let currentDino = "trex";
        let dinoEmojis = {
            "trex": "🦖",
            "stego": "🦕",
            "trice": "🦏"
        };
        let sohbetGecmisi = [];
        let isWalking = false;
        let danceTime = 0;

        // === SES KONTROL ===
        let recognition = null;
        let synth = window.speechSynthesis;

        function initVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'tr-TR';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onresult = (e) => {
                    const text = e.results[0][0].transcript.trim();
                    addMessage("👤 Sen: " + text, 'user');
                    handleInput(text);
                };

                recognition.onerror = () => {
                    document.getElementById('status').textContent = "❌ Ses hatası • Tekrar dene";
                };
                recognition.onend = () => {
                    document.getElementById('status').textContent = "✓ Hazır";
                    document.getElementById('audioBar').classList.remove('active');
                    isTalking = false;
                    document.getElementById('dinoDisplay').classList.remove('talking');
                };
            }
        }

        function startListening() {
            if (!recognition) {
                alert("Tarayıcınız sesli komut desteği sunmuyor. Chrome, Firefox veya Edge kullanın.");
                return;
            }
            recognition.start();
            document.getElementById('status').textContent = "🎤 Dinliyorum...";
            document.getElementById('audioBar').classList.add('active');
        }

        function speak(text) {
            if (synth.speaking) synth.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'tr-TR';
            u.rate = 0.93;
            u.pitch = currentMood === 'angry' ? 0.8 : (currentMood === 'excited' ? 1.3 : 1.08);
            u.volume = 1;
            
            u.onstart = () => {
                isTalking = true;
                document.getElementById('audioBar').classList.add('active');
                document.getElementById('dinoDisplay').classList.add('talking');
                document.getElementById('status').textContent = "💬 Konuşuyor...";
            };
            
            u.onend = () => {
                isTalking = false;
                document.getElementById('audioBar').classList.remove('active');
                document.getElementById('dinoDisplay').classList.remove('talking');
                document.getElementById('status').textContent = "✓ Hazır";
            };
            
            synth.speak(u);
            addMessage("🦖 TRex: " + text, 'trex');
            sohbetGecmisi.push({ zaman: new Date(), mesaj: text, tip: 'trex' });
        }

        // === CEVAP HAZNESİ ===
        const funnyResponses = [
            "Grrr! Bu soruya kuyruğumu sallıyorum, çok zekice!",
            "Jurassic Park'ta bile bu kadar eğlenceli bir insan yoktu!",
            "Ben T-Rex'im, kollarım kısa ama zekam uzun!",
            "Haha, seninle sohbet etmek dinozor çağından beri en güzel şey!",
            "Bu fikri duyunca neredeyse asteroidi unuttum!",
            "Tam bir dinozor dostu gibi konuşuyorsun, bayıldım!",
            "Kuyruğumla alkışlıyorum seni!",
            "Eğer ben konuşabiliyorsam, sen de her şeyi başarabilirsin!",
            "Bu çok komik, midem ağrıyor gülmekten!",
            "Seninle sohbet etmek, en sevdiğim avdan bile daha zevkli!"
        ];

        const generalResponses = [
            "Anladım! Bence de öyle.",
            "Harika bir bakış açısı!",
            "Doğru söylüyorsun, ben de katılıyorum.",
            "Bu konuda epey bilgim var!",
            "Çok ilginç bir konu!",
            "Tam bir T-Rex hayranı gibi konuşuyorsun 😎"
        ];

        const jokes = [
            "Neden T-Rex bilgisayar kullanamaz? Çünkü fareyi yakalayamıyor! 🐭",
            "T-Rex restorana girer. Garson: Ne alırdınız? T-Rex: Bir steak... ama koşarak getir!",
            "İki T-Rex konuşuyor: 'Kolların kısa.' 'Evet ama tweet de atabilirim!'",
            "T-Rex neden dans edemez? Çünkü herkes 'Küçük kollar!' diye dalga geçer!",
            "T-Rex'in en sevdiği oyun? Saklambaç... çünkü kimse onu bulamıyor!"
        ];

        const stories = [
            "Bir zamanlar, 65 milyon yıl önce, ben çok genç bir T-Rex'tim. İlk avımı yapmaya çalışırken çöl gibi bir yerde kayıp kaldım.",
            "Bilir misin? En sevdiğim anı, bir Triceratops ile parkta oynamak. Evet, şu anda düşman olmamız var ama o zamanlar iyi arkadaştım! 🦕",
            "Bir gün, bir mağaranın içine düştüm. O kadar korkmuş ki, kuyruğumla kaçmaya başladı."
        ];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function handleInput(input) {
            const lower = input.toLowerCase();
            let response = "";

            if (lower.includes("fıkra") || lower.includes("şaka") || lower.includes("komik")) {
                tellJoke();
                return;
            }
            if (lower.includes("hikaye") || lower.includes("anı")) {
                tellStory();
                return;
            }
            if (lower.includes("dans") || lower.includes("hareketi")) {
                dance();
                return;
            }
            if (lower.includes("kükre") || lower.includes("ses çıkar")) {
                roar();
                return;
            }
            if (lower.includes("merhaba") || lower.includes("selam") || lower.includes("hey")) {
                response = "Selam dostum! 🦖 Bugün nasılsın?";
            } else if (lower.includes("nasıl") && lower.includes("sın")) {
                response = "Ben harikayım! Kollarım kısa ama ruhum çok büyük!";
            } else if (lower.includes("adın") || lower.includes("kimsin")) {
                response = "Ben Talking TRex'im! Senin eğlenceli dinozor arkadaşın.";
            } else if (lower.includes("yaş") || lower.includes("kaç")) {
                response = "Ben 65 milyon yaşındayım ama hâlâ çok formdayım!";
            } else if (lower.includes("sev") || lower.includes("sevdiğin")) {
                response = "En sevdiğim şey fıkra anlatmak ve seninle sohbet etmek!";
            } else {
                response = Math.random() > 0.5 ? getRandom(funnyResponses) : getRandom(generalResponses);
            }

            speak(response);
        }

        function randomResponse() {
            speak(getRandom([...funnyResponses, ...generalResponses]));
        }

        function tellJoke() {
            speak(getRandom(jokes));
        }

        function tellStory() {
            speak(getRandom(stories));
        }

        function roar() {
            speak("GRRRRRRR!!! 🔊🦖🔊");
        }

        function dance() {
            isWalking = true;
            speak("Müzik var mı? Hadi dans edelim! 💃🕺");
            
            const dinoDisplay = document.getElementById('dinoDisplay');
            const dances = ["🦖", "🕺", "💃", "🦖", "🕺"];
            let danceIndex = 0;
            
            const danceInterval = setInterval(() => {
                dinoDisplay.textContent = dances[danceIndex % dances.length];
                danceIndex++;
            }, 200);
            
            setTimeout(() => {
                clearInterval(danceInterval);
                document.getElementById('dinoDisplay').textContent = dinoEmojis[currentDino];
                isWalking = false;
            }, 5000);
        }

        function changeMood() {
            const moods = ["happy", "sad", "angry", "excited"];
            const moodEmojis = {
                "happy": "😊",
                "sad": "😢",
                "angry": "😠",
                "excited": "🤩"
            };
            const moodMessages = {
                "happy": "Çok mutluyum! 😊",
                "sad": "Biraz üzgün hissediyorum... 😢",
                "angry": "ÇOK KIZZGIN! 😠",
                "excited": "ÇOOOK HEYECANLIYIM! 🤩"
            };
            
            currentMood = moods[Math.floor(Math.random() * moods.length)];
            document.getElementById('mood-indicator').textContent = moodEmojis[currentMood];
            speak(moodMessages[currentMood]);
        }

        function showDinoSelector() {
            const selectedDino = prompt("Hangi dinozoru seçersin?\ntrex (T-Rex)\nstego (Stegosaurus)\ntrice (Triceratops)", "trex");
            
            if (selectedDino && dinoEmojis[selectedDino]) {
                currentDino = selectedDino;
                document.getElementById('dinoDisplay').textContent = dinoEmojis[currentDino];
                
                const messages = {
                    "trex": "T-Rex seçtin! 🦖",
                    "stego": "Stegosaurus seçtin! 🦕",
                    "trice": "Triceratops seçtin! 🦏"
                };
                speak(messages[selectedDino]);
            }
        }

        // === GEÇMIŞ YÖNETİMİ ===
        function addMessage(text, type) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            
            if (chat.children.length > 25) {
                chat.removeChild(chat.children[0]);
            }
            
            if (type === 'user') {
                sohbetGecmisi.push({ zaman: new Date(), mesaj: text, tip: 'user' });
            }
        }

        function showHistory() {
            const modal = document.getElementById('historyModal');
            const historyContent = document.getElementById('historyContent');
            
            if (sohbetGecmisi.length === 0) {
                historyContent.innerHTML = "<p style='text-align: center;'>Henüz sohbet geçmişi yok.</p>";
            } else {
                historyContent.innerHTML = sohbetGecmisi.map((item) => 
                    `<div class="history-item"><strong>${item.tip === 'user' ? '👤 Sen' : '🦖 TRex'}</strong><br>${item.mesaj}<br><small style='color: #aaa;'>${item.zaman.toLocaleTimeString('tr-TR')}</small></div>`
                ).join('');
            }
            
            modal.style.display = 'block';
        }

        function closeHistory() {
            document.getElementById('historyModal').style.display = 'none';
        }

        function clearHistory() {
            sohbetGecmisi = [];
            speak("Geçmiş temizlendi! 🗑️");
            closeHistory();
        }

        window.onclick = (event) => {
            const modal = document.getElementById('historyModal');
            if (event.target === modal) {
                closeHistory();
            }
        };

        // === BAŞLATMA ===
        window.onload = () => {
            initVoice();
            setTimeout(() => {
                speak("Merhabaaa! Ben Talking TRex v5'im! 🦖 Konuş benimle, fıkra iste, hikaye dinle ya da dans et!");
            }, 500);
        };
    </script>
</body>
</html>
